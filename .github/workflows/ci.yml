name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Sistem bagimliliklarini kur (tesseract-ocr)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur

      - name: Python bagimliliklarini kur
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Sozdizimi kontrolu
        run: python -m py_compile app/*.py app/vision/*.py app/routers/*.py scripts/*.py

      - name: Testleri calistir
        env:
          JWT_SECRET_KEY: ci-test-secret
          WATCHLIST_ENCRYPTION_KEY: Gz3n5J9y8k2p6xQm1wZ7fL0oR4sT8vU2cA6bD9eH3iM=
        run: pytest -q
